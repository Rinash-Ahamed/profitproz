<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>Offline - ProfitPro</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; background: #09090b; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #09090b; color: #f4f4f5; font-family: Arial, sans-serif; text-align: center; }
    main { width: min(100%, 430px); border: 1px solid #27272a; border-radius: 16px; background: #18181b; padding: 32px; box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
    img { width: 72px; height: 72px; border-radius: 16px; }
    .eyebrow { margin: 26px 0 0; color: #66b159; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0 0; font-size: 27px; }
    .copy { margin: 14px 0 0; color: #a1a1aa; font-size: 14px; line-height: 1.65; }
    a { display: inline-flex; height: 44px; margin-top: 28px; align-items: center; justify-content: center; border-radius: 9px; background: #66b159; padding: 0 22px; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/pwa-192.png" alt="ProfitPro" />
    <p class="eyebrow">Connection unavailable</p>
    <h1>You’re offline</h1>
    <p class="copy">Reconnect to the internet to securely access the ProfitPro portal. Portal records are never stored for offline use.</p>
    <a href="/login">Try again</a>
  </main>
</body>
</html>
